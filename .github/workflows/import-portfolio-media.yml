name: Import portfolio media
on:
  push:
    paths:
      - .github/workflows/import-portfolio-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new portfolio repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy book cover and portrait from existing public portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/DDorii73/Introduce/main/portfolio/assets/book-cover.webp" \
            --output assets/book-cover.webp
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/DDorii73/Introduce/main/portfolio/assets/profile-eunsol.webp" \
            --output assets/profile-eunsol.webp
          test -s assets/book-cover.webp
          test -s assets/profile-eunsol.webp
      - name: Commit imported media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/book-cover.webp assets/profile-eunsol.webp
          if ! git diff --cached --quiet; then
            git commit -m "Import existing personal portfolio images"
            git push
          fi
